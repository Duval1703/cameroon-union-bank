name: Backend CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "services/api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-check:
    name: FastAPI Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile main.py models.py schemas.py auth.py database.py
